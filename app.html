<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Radar · Painel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<style>
/* Layout: SPA com rotas por hash. Entrar/cadastro em cartão central; painel com barra superior (desktop) e barra inferior (celular). Visual branco, gradiente do Instagram como acento. */
:root{--bg:#fafafa;--surface:#ffffff;--soft:#f4f4f7;--line:#e8e8ee;--ink:#111318;--muted:#6b7280;--pink:#d62976;--purple:#962fbf;--orange:#fa7e1e;--yellow:#feda75;--blue:#4f5bd5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;
--ig:linear-gradient(45deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%);--ig2:linear-gradient(100deg,#d62976,#962fbf 55%,#4f5bd5);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #962fbf;outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grad{background:var(--ig2);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.mut{color:var(--muted)}
.sm{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.fl{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;text-decoration:none;font-size:15px;transition:transform .15s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ig2);color:#fff;box-shadow:0 10px 24px -12px rgba(214,41,118,.8)}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.btn.ghost{background:var(--soft)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.ring{padding:3px;border-radius:50%;background:var(--ig);display:inline-grid;flex:none}
.ring>span{border-radius:50%;background:var(--surface);border:3px solid var(--surface);display:grid;place-items:center;font-weight:900;overflow:hidden}
.ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ring>span.grad{background:var(--surface);-webkit-background-clip:border-box;background-clip:border-box;color:#d62976}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:700;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.ok{background:#dcfce7;color:#166534}.chip.warn{background:#fef3c7;color:#92400e}.chip.bad{background:#fee2e2;color:#991b1b}.chip.ig{background:#fde7f1;color:#9d174d}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.view{animation:vin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth .side{display:none}}
.side{position:relative;background:var(--ig);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.side::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 40%),radial-gradient(circle at 70% 70%,rgba(255,255,255,.2),transparent 40%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(8%,6%) rotate(8deg)}}
.side>*{position:relative}
.side h2{font-size:40px;font-weight:900;max-width:14ch}
.side ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:12px;font-weight:700;font-size:16px}
.side li{display:flex;gap:10px;align-items:center}
.side li::before{content:"✓";width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:13px}
.formside{padding:32px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center}
.formbox{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;text-decoration:none}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--ig);position:relative;overflow:hidden}
.logo i::before{content:"";position:absolute;inset:7px;border:2.5px solid #fff;border-radius:50%}
.logo i::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:2.5px;background:#fff;transform-origin:0 50%;animation:spin 3s linear infinite;border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:800;color:var(--muted)}
.steps i{height:5px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:var(--ig2);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s}
.steps .on{color:var(--ink)} .steps .on i::after,.steps .done i::after{transform:scaleX(1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px;position:relative}
.f>span{font-size:13px;font-weight:800}
.f>span em{color:var(--pink);font-style:normal}
.f input,.f select,.f textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;transition:border-color .2s,box-shadow .2s;width:100%}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#962fbf;box-shadow:0 0 0 4px rgba(150,47,191,.12);outline:none}
.f.err input,.f.err select{border-color:var(--bad)}
.f.ok input{border-color:#22c55e}
.f .msg{font-size:12.5px;font-weight:700;min-height:0}
.f.err .msg{color:var(--bad)} .f.ok .msg{color:var(--ok)}
.f .st{position:absolute;right:12px;top:37px;width:20px;height:20px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:#962fbf;animation:spin .8s linear infinite;display:inline-block}
.pw{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.pw i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#d62976;margin-top:1px;flex:none}
.note{background:#fdf2f8;border:1px solid #fbcfe8;border-radius:14px;padding:12px 14px;font-size:13px;color:#831843}
.api{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--soft)}
.api.ok{background:#dcfce7;color:#166534}.api.fail{background:#fef3c7;color:#92400e}
.upl{display:flex;align-items:center;gap:14px}
.upl label{cursor:pointer}
.code{display:flex;gap:8px}
.code input{width:46px;height:54px;text-align:center;font-size:22px;font-weight:800;border:1.5px solid var(--line);border-radius:12px}
.code input:focus{border-color:#962fbf;outline:none;box-shadow:0 0 0 4px rgba(150,47,191,.12)}

/* app shell */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.top nav{display:flex;gap:4px;margin-left:16px}
.top nav a{text-decoration:none;color:var(--muted);font-weight:800;font-size:14px;padding:8px 12px;border-radius:10px;position:relative}
.top nav a.on{color:var(--ink);background:var(--soft)}
@media (max-width:760px){.top nav{display:none}}
.me{margin-left:auto;display:flex;align-items:center;gap:10px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:none;padding:6px max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted);text-decoration:none;padding:4px 0}
.bnav a svg{width:24px;height:24px}
.bnav a.on{color:var(--pink)}
@media (max-width:760px){.bnav{display:flex}.page{padding-bottom:100px}}
.page{padding-block:24px 60px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.ph h1{font-size:clamp(26px,4vw,34px);font-weight:900}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.kpi b{display:block;font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ig2);transform:scaleX(0);transform-origin:0 50%;animation:grow 1s .2s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:960px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.cgrid{grid-template-columns:1fr}}
.cc{display:flex;flex-direction:column;gap:12px;text-align:left;transition:transform .2s,box-shadow .2s;animation:vin .45s both;animation-delay:calc(var(--i)*.06s)}
.cc:hover{transform:translateY(-3px);box-shadow:0 20px 40px -24px rgba(17,19,24,.35)}
.cc .links{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.feed{display:flex;flex-direction:column;gap:10px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--soft);animation:vin .4s both;animation-delay:calc(var(--i)*.05s)}
.ev .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.ev .ib svg{width:18px;height:18px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}

/* concorrente */
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:800;color:var(--muted);position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--ig2)}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.posts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.post{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;animation:vin .45s both;animation-delay:calc(var(--i)*.05s)}
.post .img{aspect-ratio:1;position:relative;overflow:hidden}
.lojabar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface,#fff)}.lojabar select{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:700;background:#fff}
.rot{margin:4px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--ink)}.chip.sug{cursor:pointer;border:1px solid #e9d5ff;background:#faf5ff;font:inherit;font-size:12.5px;font-weight:700;text-align:left;max-width:100%;white-space:normal}.base{color:#7c3aed;font-weight:700}.evw{display:grid;gap:6px;justify-items:start}.evw .btn{margin-left:52px}tr.eu td{background:#fdf2f8}#cvArte{display:block}.pacotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}.pacote{display:flex;flex-direction:column;gap:8px;min-width:0}.pacote.dest{border:2px solid #d62976}.pausa{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;border-color:#fcd34d;background:#fffbeb}.cc.off{opacity:.62}.planos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.plano{display:flex;flex-direction:column;gap:10px}.plano.dest{border:2px solid #d62976;box-shadow:0 10px 30px rgba(214,41,118,.12)}.plano.atual{background:#fdf2f8}.preco{font-size:30px;font-weight:900;letter-spacing:-1px}.lst{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:13.5px;flex:1}
.heat{display:grid;grid-template-columns:34px repeat(8,minmax(0,1fr));gap:3px;font-size:10.5px}.heat .hh{text-align:center;color:var(--muted);font-weight:700}.heat .hd{color:var(--muted);font-weight:800;display:flex;align-items:center}.heat .hc{aspect-ratio:1.4;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:10px}
.sino{position:relative;padding:8px 10px}.sino .bolinha{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:2px 6px}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.tipos .modo{padding:10px}.trava{border:1.5px dashed #e9d5ff}
.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.modo{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;text-align:center;font-size:13px;position:relative}.modo input{position:absolute;opacity:0;pointer-events:none}.modo span{font-size:22px}.modo:has(input:checked){border-color:#d62976;background:#fdf2f8;box-shadow:0 0 0 3px rgba(214,41,118,.12)}.modo:has(input:focus-visible){outline:2px solid #962fbf}
.cal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:900px){.cal{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.cal{grid-template-columns:1fr}}
.cald{display:flex;flex-direction:column;gap:8px;animation:vin .45s both;animation-delay:calc(var(--i)*.06s)}
.leg{background:var(--soft,#f6f6fa);border-radius:12px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;color:var(--muted);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rel{display:grid;gap:14px}.relhead{border-bottom:3px solid;border-image:linear-gradient(90deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5) 1;padding-bottom:14px}
@media print{header.top,.bnav,.noprint,#toast{display:none!important}body{background:#fff!important}main.page{padding:0!important}.card{box-shadow:none!important;break-inside:avoid}.rel .posts{grid-template-columns:repeat(3,1fr)!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.post .img img{width:100%;height:100%;object-fit:cover;display:block}.semfoto{display:grid;place-items:center;width:100%;height:100%;background:var(--soft,#f4f4f7);color:var(--muted);font-size:12px;font-weight:700}
.post .img svg{width:100%;height:100%;display:block;transition:transform .5s}
.post:hover .img svg{transform:scale(1.05)}
.post .img .tp{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.post .img .hot{position:absolute;right:8px;top:8px;background:var(--ig2);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.post .tx{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.post .mt{display:flex;gap:10px;color:var(--muted);font-size:12px;font-weight:700;flex-wrap:wrap}
.ai{border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--ig2) border-box}
.acts{display:grid;gap:10px}
.act{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--soft)}
.act .n{width:30px;height:30px;border-radius:10px;background:var(--ig2);color:#fff;font-weight:900;display:grid;place-items:center;flex:none}
.cmp{display:grid;gap:14px}
.bar{height:10px;border-radius:10px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.scan{position:relative;overflow:hidden}
.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(214,41,118,.12),transparent);transform:translateX(-100%);animation:sweep 1.2s linear infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.timer{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.timer .dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pu 1.8s infinite}
@keyframes pu{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.clock{width:46px;height:46px;flex:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(17,19,24,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fin .2s}
@keyframes fin{from{opacity:0}}
.modal>div{background:var(--surface);border-radius:24px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;animation:mup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes mup{from{transform:translateY(20px) scale(.97);opacity:.5}}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:70}
.ill{font-size:11px;color:var(--muted);font-style:italic}

/* ---- correções de layout (textos longos, telas pequenas) ---- */
main.page,.modal,#modalBox{overflow-wrap:anywhere}
.two>*,.cgrid>*,.cal>*,.posts>*,.kpis>*,.planos>*,.feed>*,.acts>*,.tipos>*,.modos>*{min-width:0}
.card,.post,.post .tx,.act>div,.ev>.fl{min-width:0}
.row>.fl,.row>span,.row>b,.row>p,.row>a{min-width:0}
.chip{white-space:normal;max-width:100%;overflow-wrap:anywhere;text-align:left}
.relhead .row,.ph{flex-wrap:wrap}
.meta{display:grid;gap:2px}.meta .mt-t{font-weight:700}.meta .mt-v{font-size:16px;line-height:1.35}
.kpi b{overflow-wrap:normal;word-break:keep-all;line-height:1.1;font-size:clamp(20px,6.5vw,30px)}
[style*="overflow-x:auto"]>.tbl{min-width:460px}
.code{display:grid;grid-template-columns:repeat(6,minmax(0,46px));gap:6px}.code input{width:100%;min-width:0;padding:0}
.btn{max-width:100%}.card .btn,.ph .btn{white-space:normal;text-align:center}
@media(max-width:400px){.top .me .btn span{display:none}.top .me{gap:6px}.top .wrap{gap:8px}}.tbl th{white-space:nowrap}.tbl td{overflow-wrap:normal}
.relhead .fl{min-width:170px}
.tbl td,.tbl th{overflow-wrap:anywhere}
img,svg{max-width:100%}
</style>
